name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest -v
      - name: Run fallback eval
        run: python scripts/eval.py --no-model
      - name: Run heldout eval
        run: python scripts/eval.py --no-model --tasks eval/heldout_tasks.jsonl
      - name: Run external public eval
        run: python scripts/eval.py --no-model --tasks eval/external_public_tasks.jsonl
